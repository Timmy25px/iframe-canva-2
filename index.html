<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden; /* Supprime les scrollbars */
    background: #000;
}

#canva {
    position: fixed;
    inset: 0;
    overflow: hidden;
}

#canva iframe {
    position: absolute;
    top: 50%;
    left: 50%;

    /* Plus grand que le conteneur */
    width: 115%;
    height: 115%;

    /* Centre l'iframe */
    transform: translate(-50%, -50%);

    border: none;
}
</style>

</head>
<body>

<div id="canva">
    <iframe
        loading="lazy"
        src="https://www.canva.com/design/DAHQHalUtOM/VW_lvRTYlOogieRFHmu3SA/view?embed"
        allowfullscreen
        allow="fullscreen">
    </iframe>
</div>

</body>
</html>
