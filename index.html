<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden; /* Supprime les scrollbars */
    background: #000;
}

#canva {
    position: fixed;
    inset: 0;
    overflow: hidden;
}

#canva iframe {
    position: absolute;
    top: 50%;
    left: 50%;

    /* Plus grand que le conteneur */
    width: 115%;
    height: 115%;

    /* Centre l'iframe */
    transform: translate(-50%, -50%);

    border: none;
}
</style>

</head>
<body>
<style>
#compteur-obs {
    position: absolute;
    top: 20px;
    left: 20px;
    width: 900px;
    height: 150px;
    border: none;
    z-index: 999999;
    resize: both;
    overflow: hidden;
}
</style>

<iframe 
id="compteur-obs"
src="https://timmy25px.github.io/compteur-temporel-3/"
allowtransparency="true">
</iframe>
}
    
<div id="canva">
    <iframe
        loading="lazy"
        src="https://www.canva.com/design/DAHQHalUtOM/VW_lvRTYlOogieRFHmu3SA/view?embed"
        allowfullscreen
        allow="fullscreen">
    </iframe>
</div>
<iframe 
src="clock-3.html"
id="clock-source">
</iframe>


<style>

#clock-source{

position:fixed;

top:50px;
left:50px;

width:1200px;
height:150px;

border:none;

background:transparent;

z-index:9999;

}

</style>
</body>
</html>
